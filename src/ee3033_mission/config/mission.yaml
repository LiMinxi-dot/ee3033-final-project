# Tunable parameters for the EE3033 target search mission.
# Launch files load this file; override a value on the command line with
#   ros2 launch ee3033_mission mission.launch.py params_file:=/path/to/other.yaml

target_detector:
  ros__parameters:
    model_path: /home/ros2_ws/models/yolov8n.pt   # .pt (PyTorch) or *_ncnn_model folder
    image_topic: /camera/image_raw
    use_compressed: false          # true when running off-board on /camera/image_raw/compressed
    camera_frame: camera_link      # TF frame of the camera (x forward, y left)
    target_classes: ["bottle"]     # COCO class names (bottle, cup, sports ball, backpack, ...);
                                   # set to the demo target. It must reach the LiDAR plane (~19 cm)
                                   # and not be transparent/shiny, or set target_height below.
    conf_threshold: 0.45
    imgsz: 640                     # Pi 5, 2 threads, robot standing: 320 69 ms/frame, 416 93, 480 120, 544 143,
                                   # 640 185. A 0.205 m bottle 0.7 m away scored 0.21 at 320 (below conf_threshold
                                   # and the localizer's min_score: three site missions found nothing), 0.67 at
                                   # 416, 0.89 at 640 upright (0.41-0.51 upside down)
    max_rate: 5.0                  # frames/s at most; at the 0.5 rad/s spin a target stays ~2 s in view
    num_threads: 2                 # PyTorch threads (0 = all 4 cores). With all cores YOLO ran back to back
                                   # (load 5-7) and Nav2 missed a 4 s heartbeat in the site mission
    debug_image: true              # annotated JPEG on /target_detector/debug_image/compressed
    debug_rate: 2.0

cmd_vel_watchdog:
  ros__parameters:
    input_topic: /cmd_vel_teleop   # teleop on the VM publishes here
    output_topic: /cmd_vel
    timeout: 0.6                   # s without a command -> stop (the base itself has no timeout);
                                   # > the ~0.5 s key-repeat delay of teleop_twist_keyboard
    max_linear: 0.25
    max_angular: 1.2

auto_mapper:
  ros__parameters:
    global_frame: map
    robot_frame: base_footprint
    auto_start: false              # false: start with ros2 service call /explore/start std_srvs/srv/Trigger
    robot_radius: 0.15             # m; paths keep this far from walls (robot radius 0.12)
    unknown_clearance: 0.20        # m; goals keep this far from unknown space (it may hide a wall the LiDAR missed)
    goal_clearance: 0.15           # m; goals keep this far from walls: a goal at a wall (e.g. for
                                   # (0.20 left frontiers behind 0.4 m passages unexplored in test mazes)
                                   # a frontier seen through a gap) left the robot where Nav2 could not plan or recover
    min_frontier_size: 0.15        # m; shorter frontiers are SLAM noise (0.20 dropped the frontier of a narrow opening
                                   # seen at an angle, 3 cells, and the region behind it stayed unmapped; test mazes:
                                   # 0.15 explores as completely with +4.5 % path, 0.10 +11 %)
    goal_reach: 0.5                # m; the goal is a safe cell at most this far from the frontier
    gain_weight: 0.3               # cost = path length - gain_weight * frontier size
    blacklist_radius: 0.3
    blacklist_shrink: 0.7          # goal reached but >= this share of its frontier left -> blacklist (a large
                                   # frontier partly resolved stays open; test maze: a 1.45 m frontier was
                                   # blacklisted whole after one look and that corner stayed unmapped)
    max_radius: 0.0                # m from home; > 0 ignores frontiers outside (e.g. LiDAR seeing out of the sandbox)
    replan_period: 1.0
    progress_timeout: 15.0         # s without getting 0.1 m closer -> blacklist the frontier
    finish_goals: true             # frontier explored on the way: still drive to its goal while that is safe and
                                   # reachable (site: all goals on one side were cancelled after the LiDAR saw past
                                   # a thin wall end-on, and the wall was missing from the map)
    nav_timeout: 30.0              # s per Nav2 goal (route legs are at most route_max_leg long)
    stuck_time: 8.0                # s; a Nav2 goal during which the robot moves less than stuck_move ends:
    stuck_move: 0.05               # m  reached if within stuck_accept of it, else failed (escape, retry)
    stuck_accept: 0.20             # m
    leg_skip: 0.15                 # m; a route leg whose waypoint is this close already is skipped
    settle_timeout: 6.0            # max wait for a fresh /map after reaching a goal
    finish_wait: 6.0               # s without any reachable frontier -> exploration done
    max_duration: 300.0            # s, then return home anyway
    return_home: true
    home_retries: 2
    home_tolerance: 0.25
    route_clearance: 0.15          # m; the way home is planned through cells this far from walls/unknown, along
                                   # corridor centres, and driven in straight legs of at most route_max_leg
    route_max_leg: 0.8
    turn_first_deg: 45.0           # goal direction more than this off the heading: turn in place first (Nav2
                                   # spin); DWB turned in a forward arc into the wall next to the robot. 0 = off
    escape: true                   # robot closer than escape_trigger to a map wall (Nav2 will neither plan nor
    escape_trigger: 0.11           # turn there; Nav2 robot_radius 0.10 + padding 0.01): before a goal, and once
                                   # after a failed one, drive straight
    escape_target: 0.14            # away from the wall (m from the walls to reach); if no straight move gets
                                   # clear, first turn in place as far as the LiDAR shows the corners free
    escape_max_forward: 0.25       # m; and only as far as the LiDAR shows the robot's width free ahead
    escape_max_backward: 0.15      # m; the LiDAR cannot see behind the robot: the map alone decides
    escape_speed: 0.05             # m/s, through the velocity smoother (/cmd_vel_nav)
    escape_turn_speed: 0.3         # rad/s
    escape_margin: 0.01            # m around the robot's rectangle in the LiDAR checks
    body_half_length: 0.06         # m; the robot is 0.115 m long and 0.20 m wide (camera cable on the left)
    body_half_width: 0.10
    map_file: /home/ros2_ws/maps/sandbox   # writes sandbox.pgm + sandbox.yaml

target_localizer:
  ros__parameters:
    global_frame: map
    scan_topic: /scan_fixed
    camera_info_topic: /camera_info
    hfov_deg: 62.0                 # used until the camera is calibrated (camera_info K)
    # Camera mount calibration of our car (balance4), measured 2026-10-21, relative to the course
    # TF frame camera_link (x forward, y left, yaw CCW): camera 1-2 cm left of the centre line,
    # optical axis about 8 deg to the left. Height does not matter: localization is planar.
    # Re-measure only if the camera is moved: x/y by hand, yaw with
    #   ros2 run ee3033_mission camera_lidar_check
    camera_offset_x: 0.0
    camera_offset_y: 0.015
    camera_offset_yaw_deg: 8.3
    use_camera_info: true
    min_score: 0.5
    min_range: 0.15
    max_range: 4.0                 # ignore detections further than this (m)
    ray_half_width_deg: 2.0        # minimum LiDAR search half-width around the target bearing
    cluster_depth: 0.15
    target_radius: 0.04            # LiDAR hits the surface; add the object radius (m)
    target_height: 0.0             # > 0: monocular range fallback from the box height (m)
    max_scan_age: 0.25
    cluster_radius: 0.30           # observations within this distance are fused
    min_observations: 6            # needed to confirm the target (4 with a 0.14 m spread gave a 15 cm error)
    max_spread: 0.10
    ignore_map_walls: true         # LiDAR hits on the walls of the saved map never give the target range
    wall_margin: 0.08              # m from a wall cell centre that counts as "on the wall": the wall cells and
                                   # their 8 neighbours (hits on a wall surface land in the next cell)

mission_manager:
  ros__parameters:
    global_frame: map
    robot_frame: base_footprint
    auto_start: false              # false: start with ros2 service call /mission/start std_srvs/srv/Trigger
    set_initial_pose: true
    initial_pose: [0.0, 0.0, 0.0]  # mapping starts at the start position, so it is the map origin
    initial_xy_std: 0.10           # m; AMCL initial pose uncertainty
    initial_yaw_std_deg: 20.0      # deg; wide enough for AMCL to correct a robot placed a bit askew
    localize_wait: 2.0             # s of AMCL no-motion updates before the localization check
    localization_check: true       # the LiDAR scan must fit the map walls before the robot moves (see the log
                                   # lines starting with [loc]); checked again at every viewpoint (warning only)
    min_scan_match: 0.75           # fraction of LiDAR points that must lie on the map walls
                                   # (home arena: 87-99 % when localized, 11-48 % when 56-65 deg off)
    scan_match_margin: 0.10        # also fail if a nearby pose fits better by this much: in a small arena
                                   # 60 % of the points still land near a wall when the robot is 20-40 deg off
    auto_calibrate: true           # failed check at the start: if the scan clearly fits one nearby pose (robot
                                   # placed askew, or turned while waiting: site 25 deg, then 0.45 deg/s), use it as
                                   # AMCL's initial pose and check again ([loc] AUTO-CALIBRATION lines)
    calibrate_min_fit: 0.90        # ... needs this fraction of the LiDAR points on the walls at that pose (98-100 %
                                   # on site when the robot was misplaced; < 55 % when it fitted nowhere)
    calibrate_margin: 0.10         # ... and any separate fit peak at a heading >= 20 deg away must fit worse by
                                   # this much (an arena that looks alike from two headings is left to the operator)
    max_calibrations: 3            # per /mission/start
    scan_topic: /scan_fixed
    scan_min_range: 0.13           # m; closer LiDAR hits are the robot itself (below 6.5 cm, now and then up to
                                   # 12 cm behind the LiDAR); the same limit is set for SLAM (mapping.launch.py,
                                   # min_laser_range) and the costmaps (nav2.launch.py, obstacle_min_range)
    initial_spin: true
    spin_angle_deg: 360.0
    view_range: 1.5                # m; the planner places viewpoints (the number is up to it) so that every free
                                   # cell is within this distance and in line of sight of one of them
                                   # (YOLO must find the target this far away: check on site, see imgsz)
    candidate_spacing: 0.25        # m; grid of candidate viewpoints
    min_clearance: 0.15            # m from walls/unknown space (0.20 cut off two rooms behind 0.30-0.34 m passages
                                   # on site map 1105_043031: 61 % seen instead of 96 %; mapping drives at 0.15 too)
    max_viewpoints: 40
    nav_timeout: 30.0              # s per Nav2 goal (route legs are at most route_max_leg long)
    stuck_time: 8.0                # s; a Nav2 goal during which the robot moves less than stuck_move ends:
    stuck_move: 0.05               # m  reached if within stuck_accept of it, else failed (escape, retry)
    stuck_accept: 0.20             # m
    leg_skip: 0.15                 # m; a route leg whose waypoint is this close already is skipped
    spin_timeout: 25.0
    home_tolerance: 0.25
    home_retries: 2
    route_clearance: 0.15          # m; routes to viewpoints and home: straight legs along corridor centres
    route_max_leg: 0.8
    turn_first_deg: 45.0           # as auto_mapper
    escape: true                   # as auto_mapper (a viewpoint spin left the robot in a map wall: stuck)
    escape_trigger: 0.11
    escape_target: 0.14
    escape_max_forward: 0.25
    escape_max_backward: 0.15
    escape_speed: 0.05
    escape_turn_speed: 0.3
    escape_margin: 0.01
    body_half_length: 0.06
    body_half_width: 0.10
    report_unconfirmed: true       # report the best guess if the target was never confirmed
    result_file: /home/ros2_ws/mission_result.yaml
